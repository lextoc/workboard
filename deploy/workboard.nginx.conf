server {
    listen 80;
    listen [::]:80;
    server_name workboard.alexanderclaes.be;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://workboard.alexanderclaes.be$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name workboard.alexanderclaes.be;

    ssl_certificate /etc/letsencrypt/live/workboard.alexanderclaes.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workboard.alexanderclaes.be/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "Workboard";
    auth_basic_user_file /etc/workboard/htpasswd;
    client_max_body_size 16k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location / {
        if ($http_origin !~ "^$|^https://workboard\.alexanderclaes\.be$") {
            return 403;
        }
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_read_timeout 60s;
    }
}
