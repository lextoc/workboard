quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:file:./data/workboard
%dev.quarkus.hibernate-orm.schema-management.strategy=update
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:workboard-test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.flyway.migrate-at-start=true
%prod.quarkus.hibernate-orm.schema-management.strategy=validate

quarkus.http.auth.basic=false
quarkus.http.auth.form.enabled=false
quarkus.http.auth.proactive=false
quarkus.security.jaxrs.deny-unannotated-endpoints=true

app.auth.cookie-name=__Host-workboard-session
app.auth.cookie-secure=true
app.auth.allowed-origin=https://workboard.alexanderclaes.be

%dev.app.auth.cookie-name=workboard-session
%dev.app.auth.cookie-secure=false
%dev.app.auth.allowed-origin=http://localhost:${quarkus.http.port:8080}

%test.app.auth.cookie-name=workboard-session
%test.app.auth.cookie-secure=false
%test.app.auth.allowed-origin=http://localhost:8081
