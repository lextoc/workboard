quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:file:./data/workboard
%dev.quarkus.hibernate-orm.schema-management.strategy=update
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:workboard-test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.flyway.migrate-at-start=true
%prod.quarkus.hibernate-orm.schema-management.strategy=validate